name: Bug report
description: Report incorrect launcher or pane behavior
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes: { label: Summary, description: Describe the incorrect behavior. }
    validations: { required: true }
  - type: textarea
    id: reproduce
    attributes: { label: Reproduction, description: Include the sanitized command, working directory, expected layout, actual result, and --check output. }
    validations: { required: true }
  - type: input
    id: environment
    attributes: { label: Environment, description: Windows and Windows Terminal versions }
    validations: { required: true }

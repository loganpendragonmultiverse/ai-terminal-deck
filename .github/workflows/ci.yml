name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  workflow_dispatch:
    inputs:
      inert_quoting_diagnostics:
        description: Inert raw cmd diagnostics only; no Terminal execution
        type: boolean
        required: false
        default: false
      native_ui_case:
        description: Reviewed real-Terminal case; off keeps normal CI only
        type: choice
        required: false
        default: 'off'
        options: ['off', '1', '2', '3']
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run launcher behavior tests
        shell: pwsh
        run: ./tests/Test-AITerminalDeck.ps1
      - name: Build release artifacts
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Verify release outputs
        shell: pwsh
        run: |
          @(
            "dist/Launch-AI-Terminal-Deck.bat",
            "dist/ai-terminal-deck-1.1.0.zip",
            "dist/SHA256SUMS.txt"
          ) | ForEach-Object {
            if (-not (Test-Path -LiteralPath $_ -PathType Leaf)) { throw "Missing artifact: $_" }
          }
      - name: Verify packaged content and refusal safety
        shell: pwsh
        run: ./tests/Test-Package.ps1
      - name: Preserve reviewed candidate artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ai-terminal-deck-candidate
          path: |
            dist/Launch-AI-Terminal-Deck.bat
            dist/ai-terminal-deck-*.zip
            dist/SHA256SUMS.txt
  native-ui-candidate:
    if: github.event_name == 'workflow_dispatch' && inputs.native_ui_case != 'off'
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify reviewed observer transport bytes
        shell: pwsh
        run: |
          $observer = Join-Path $env:GITHUB_WORKSPACE '.github/verification/HostedNativeUI.ps1'
          if ((Get-FileHash -LiteralPath $observer -Algorithm SHA256).Hash.ToLowerInvariant() -ne '2dbc1e4a53956a746922085c5a675037815f96c2d51f5a49adf14116aade0b21') { throw 'Reviewed observer bytes changed' }
      - name: Parse observer with actual Windows PowerShell before any Terminal download
        shell: pwsh
        run: |
          $hostPS = Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'
          $env:DECK_OBSERVER_PATH = Join-Path $env:GITHUB_WORKSPACE '.github/verification/HostedNativeUI.ps1'
          $env:DECK_PARSER_REPORT = Join-Path $env:RUNNER_TEMP 'deck-ui-parser'
          $parseCode = @'
          $parseTokens=$null; $parseErrors=$null
          [void][Management.Automation.Language.Parser]::ParseFile($env:DECK_OBSERVER_PATH,[ref]$parseTokens,[ref]$parseErrors)
          New-Item -ItemType Directory -Path $env:DECK_PARSER_REPORT -ErrorAction Stop | Out-Null
          $parserProof = [ordered]@{powershell=$PSVersionTable.PSVersion.ToString();os=[Environment]::OSVersion.VersionString;file_sha256=(Get-FileHash -LiteralPath $env:DECK_OBSERVER_PATH -Algorithm SHA256).Hash;error_count=$parseErrors.Count;errors=@($parseErrors | ForEach-Object {$_.ToString()})}
          $parserProof | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $env:DECK_PARSER_REPORT 'parser-result.json') -Encoding UTF8
          if ($parseErrors.Count -gt 0) { $parseErrors | ForEach-Object { Write-Error ($_.ToString()) }; exit 1 }
          Write-Host ('Windows PowerShell observer parser passed: '+$PSVersionTable.PSVersion.ToString())
          '@
          & $hostPS -NoProfile -NonInteractive -Command $parseCode
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell observer parser failed; no Terminal operation permitted' }
      - name: Compile built-in observer and inspect existing desktop before download
        shell: pwsh
        env:
          DECK_NATIVE_UI_CASE: ${{ inputs.native_ui_case }}
        run: |
          $hostPS = Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'
          & $hostPS -NoProfile -Mta -File .github/verification/HostedNativeUI.ps1 -ToolCount $env:DECK_NATIVE_UI_CASE -FrozenAssets "$env:RUNNER_TEMP/deck-frozen-assets" -EvidenceDirectory "$env:RUNNER_TEMP/deck-ui-preflight" -PreflightOnly
          if ($LASTEXITCODE -ne 0) { throw 'Compile/desktop preflight failed; no Terminal operation permitted' }
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: 12312291511
          repository: loganpendragonmultiverse/ai-terminal-deck
          run-id: 39522743243
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/deck-frozen-assets
      - name: One real Windows Terminal UI case
        shell: pwsh
        env:
          DECK_NATIVE_UI_CASE: ${{ inputs.native_ui_case }}
        run: |
          $hostPS = Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'
          & $hostPS -NoProfile -Mta -File .github/verification/HostedNativeUI.ps1 -ToolCount $env:DECK_NATIVE_UI_CASE -FrozenAssets "$env:RUNNER_TEMP/deck-frozen-assets" -EvidenceDirectory "$env:RUNNER_TEMP/deck-ui-evidence"
          if ($LASTEXITCODE -ne 0) { throw 'Real UI case unavailable or failed; inspect evidence' }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: real-terminal-ui-case-${{ inputs.native_ui_case }}
          path: |
            ${{ runner.temp }}/deck-ui-evidence
            ${{ runner.temp }}/deck-ui-preflight
            ${{ runner.temp }}/deck-ui-parser
          if-no-files-found: warn
          retention-days: 7
  inert-quoting-diagnostics:
    if: github.event_name == 'workflow_dispatch' && inputs.inert_quoting_diagnostics == true
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Parse exact diagnostic with Windows PowerShell before execution
        shell: pwsh
        run: |
          $script = Join-Path $env:GITHUB_WORKSPACE '.github/verification/InertQuotingDiagnostics.ps1'
          if ((Get-FileHash -LiteralPath $script -Algorithm SHA256).Hash.ToLowerInvariant() -ne '8dc1b426d7df52b76b9a8c7ce1f2399d8b83a377a0f9e8577a219fc556c0dc89') { throw 'Diagnostic bytes changed' }
          $env:DECK_DIAGNOSTIC_SCRIPT = $script
          $hostPS = Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'
          $parseCode = @'
          $tokens=$null; $errors=$null
          [void][Management.Automation.Language.Parser]::ParseFile($env:DECK_DIAGNOSTIC_SCRIPT,[ref]$tokens,[ref]$errors)
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error ($_.ToString()) }; exit 1 }
          Write-Host ('Actual Windows PowerShell parser passed: '+$PSVersionTable.PSVersion.ToString())
          '@
          & $hostPS -NoProfile -NonInteractive -Command $parseCode
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic parser failed' }
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: 12312291511
          repository: loganpendragonmultiverse/ai-terminal-deck
          run-id: 39522743243
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/deck-inert-frozen-assets
      - name: Inert raw cmd quoting diagnostics only
        shell: pwsh
        run: |
          $hostPS = Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'
          & $hostPS -NoProfile -File .github/verification/InertQuotingDiagnostics.ps1 -FrozenAssets "$env:RUNNER_TEMP/deck-inert-frozen-assets" -EvidenceDirectory "$env:RUNNER_TEMP/deck-inert-evidence"
          if ($LASTEXITCODE -ne 0) { throw 'Inert diagnostic failed; preserve evidence and stop' }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: inert-quoting-diagnostic
          path: ${{ runner.temp }}/deck-inert-evidence
          if-no-files-found: warn
          retention-days: 7

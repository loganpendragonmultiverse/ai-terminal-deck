name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  workflow_dispatch:
    inputs:
      native_ui_case:
        description: Reviewed real-Terminal case; off keeps normal CI only
        type: choice
        required: false
        default: 'off'
        options: ['off', '1', '2', '3']
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run launcher behavior tests
        shell: pwsh
        run: ./tests/Test-AITerminalDeck.ps1
      - name: Run full launcher tests in Windows PowerShell 5.1
        shell: powershell
        run: ./tests/Test-AITerminalDeck.ps1
      - name: Build release artifacts
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Verify release outputs
        shell: pwsh
        run: |
          @(
            "dist/Launch-AI-Terminal-Deck.bat",
            "dist/ai-terminal-deck-1.1.0.zip",
            "dist/SHA256SUMS.txt"
          ) | ForEach-Object {
            if (-not (Test-Path -LiteralPath $_ -PathType Leaf)) { throw "Missing artifact: $_" }
          }
      - name: Verify packaged content and refusal safety
        shell: pwsh
        run: ./tests/Test-Package.ps1
      - name: Preserve reviewed candidate artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ai-terminal-deck-candidate
          path: |
            dist/Launch-AI-Terminal-Deck.bat
            dist/ai-terminal-deck-*.zip
            dist/SHA256SUMS.txt
  native-ui-candidate:
    if: github.event_name == 'workflow_dispatch' && inputs.native_ui_case != 'off'
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify reviewed observer transport bytes
        shell: pwsh
        run: |
          $observer = Join-Path $env:GITHUB_WORKSPACE '.github/verification/HostedNativeUI.ps1'
          if ((Get-FileHash -LiteralPath $observer -Algorithm SHA256).Hash.ToLowerInvariant() -ne '5ca94d22a62d8d8e309fe5b2a06358178aadafa0bdfe93b1a976f323fb5b420a') { throw 'Reviewed observer bytes changed' }
          $control = Join-Path $env:GITHUB_WORKSPACE '.github/verification/ReceiptNegativeControl.ps1'
          if ((Get-FileHash -LiteralPath $control -Algorithm SHA256).Hash.ToLowerInvariant() -ne '92bb270cc1d6a79c6f83e5cafb681fda33b7367518404bc3f6d5cd43e8c70dbb') { throw 'Reviewed inert control bytes changed' }
      - name: Parse observer and inert control with actual Windows PowerShell before any Terminal download
        shell: pwsh
        run: |
          $hostPS = Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'
          $env:DECK_OBSERVER_PATH = Join-Path $env:GITHUB_WORKSPACE '.github/verification/HostedNativeUI.ps1'
          $env:DECK_CONTROL_PATH = Join-Path $env:GITHUB_WORKSPACE '.github/verification/ReceiptNegativeControl.ps1'
          $env:DECK_PARSER_REPORT = Join-Path $env:RUNNER_TEMP 'deck-ui-parser-${{ github.run_id }}-${{ github.run_attempt }}-case${{ inputs.native_ui_case }}'
          $parseCode = @'
          New-Item -ItemType Directory -Path $env:DECK_PARSER_REPORT -ErrorAction Stop | Out-Null
          $parserProof=@()
          foreach($parsePath in @($env:DECK_OBSERVER_PATH,$env:DECK_CONTROL_PATH)){
           $parseTokens=$null; $parseErrors=$null
           [void][Management.Automation.Language.Parser]::ParseFile($parsePath,[ref]$parseTokens,[ref]$parseErrors)
           $parserProof += [ordered]@{powershell=$PSVersionTable.PSVersion.ToString();os=[Environment]::OSVersion.VersionString;file_sha256=(Get-FileHash -LiteralPath $parsePath -Algorithm SHA256).Hash;error_count=$parseErrors.Count;errors=@($parseErrors | ForEach-Object {$_.ToString()})}
          }
          $parserProof | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $env:DECK_PARSER_REPORT 'parser-result.json') -Encoding UTF8
          if (@($parserProof | Where-Object {$_.error_count -gt 0}).Count -gt 0) { throw 'Observer/control parser failed' }
          Write-Host ('Windows PowerShell observer parser passed: '+$PSVersionTable.PSVersion.ToString())
          '@
          & $hostPS -NoProfile -NonInteractive -Command $parseCode
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell observer parser failed; no Terminal operation permitted' }
      - name: Compile built-in observer and inspect existing desktop before download
        shell: pwsh
        env:
          DECK_NATIVE_UI_CASE: ${{ inputs.native_ui_case }}
        run: |
          $hostPS = Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'
          & $hostPS -NoProfile -Mta -File .github/verification/HostedNativeUI.ps1 -ToolCount $env:DECK_NATIVE_UI_CASE -FrozenAssets "$env:RUNNER_TEMP/deck-frozen-assets" -EvidenceDirectory "$env:RUNNER_TEMP/deck-ui-preflight-${{ github.run_id }}-${{ github.run_attempt }}-case${{ inputs.native_ui_case }}" -PreflightOnly
          if ($LASTEXITCODE -ne 0) { throw 'Compile/desktop preflight failed; no Terminal operation permitted' }
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: 12326774660
          repository: loganpendragonmultiverse/ai-terminal-deck
          run-id: 39561085714
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/deck-frozen-assets
      - name: One real Windows Terminal UI case
        shell: pwsh
        env:
          DECK_NATIVE_UI_CASE: ${{ inputs.native_ui_case }}
        run: |
          $hostPS = Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'
          & $hostPS -NoProfile -Mta -File .github/verification/HostedNativeUI.ps1 -ToolCount $env:DECK_NATIVE_UI_CASE -FrozenAssets "$env:RUNNER_TEMP/deck-frozen-assets" -EvidenceDirectory "$env:RUNNER_TEMP/deck-ui-evidence-${{ github.run_id }}-${{ github.run_attempt }}-case${{ inputs.native_ui_case }}"
          if ($LASTEXITCODE -ne 0) { throw 'Real UI case unavailable or failed; inspect evidence' }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: final-tag-real-terminal-${{ github.run_id }}-${{ github.run_attempt }}-case-${{ inputs.native_ui_case }}
          path: |
            ${{ runner.temp }}/deck-ui-evidence-${{ github.run_id }}-${{ github.run_attempt }}-case${{ inputs.native_ui_case }}
            ${{ runner.temp }}/deck-ui-preflight-${{ github.run_id }}-${{ github.run_attempt }}-case${{ inputs.native_ui_case }}
            ${{ runner.temp }}/deck-ui-parser-${{ github.run_id }}-${{ github.run_attempt }}-case${{ inputs.native_ui_case }}
          if-no-files-found: warn
          retention-days: 7


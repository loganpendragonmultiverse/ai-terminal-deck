name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run launcher behavior tests
        shell: pwsh
        run: ./tests/Test-AITerminalDeck.ps1
      - name: Build release artifacts
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Verify release outputs
        shell: pwsh
        run: |
          @(
            "dist/Launch-AI-Terminal-Deck.bat",
            "dist/ai-terminal-deck-1.0.4.zip",
            "dist/SHA256SUMS.txt"
          ) | ForEach-Object {
            if (-not (Test-Path -LiteralPath $_ -PathType Leaf)) { throw "Missing artifact: $_" }
          }
